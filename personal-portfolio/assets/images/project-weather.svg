<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="weatherShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#weatherBg)"/>

  <!-- Subtle Rain / Wind particle lines -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.15">
    <line x1="80" y1="40" x2="60" y2="80"/>
    <line x1="160" y1="120" x2="140" y2="160"/>
    <line x1="450" y1="50" x2="430" y2="90"/>
    <line x1="530" y1="130" x2="510" y2="170"/>
    <line x1="320" y1="20" x2="300" y2="60"/>
  </g>

  <!-- Main Weather Dashboard Card -->
  <g transform="translate(30, 24)" filter="url(#weatherShadow)">
    <rect width="540" height="312" rx="14" fill="#0c172e" stroke="#1e3a5f" stroke-width="1.2"/>

    <!-- Search Header Bar -->
    <rect width="540" height="48" rx="14" fill="#13223f"/>
    <rect y="36" width="540" height="12" fill="#13223f"/>
    <line x1="0" y1="48" x2="540" y2="48" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="24" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>

    <!-- Search Input Box Representation -->
    <g transform="translate(100, 10)">
      <rect width="320" height="28" rx="14" fill="#091326" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <line x1="20" y1="17.5" x2="24" y2="21.5" stroke="#64748b" stroke-width="1.5"/>
      <text x="32" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Search city (e.g. Addis Ababa, New York, London)...</text>
    </g>

    <!-- Live Telemetry Pill -->
    <rect x="440" y="14" width="80" height="22" rx="11" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="452" cy="25" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="462" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#38bdf8">LIVE API</text>

    <!-- Main Weather Info Section -->
    <g transform="translate(24, 66)">
      <!-- Left: City & Temperature Display -->
      <g transform="translate(10, 10)">
        <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Addis Ababa, ET</text>
        <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Partly Cloudy • Updated Just Now</text>
        
        <text x="0" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="800" fill="#f8fafc">23°<tspan font-size="24" font-weight="400" fill="#38bdf8">C</tspan></text>
        <text x="110" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">Feels like 22°C</text>
        <text x="110" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#38bdf8">H: 25°  L: 14°</text>
      </g>

      <!-- Center: Weather Graphic (Sun with Clouds) -->
      <g transform="translate(190, 15)">
        <circle cx="75" cy="50" r="28" fill="url(#sunGlow)"/>
        <!-- Cloud shape -->
        <path d="M50 78 H95 A16 16 0 0 0 95 46 A22 22 0 0 0 55 42 A18 18 0 0 0 46 62 A16 16 0 0 0 50 78 Z" fill="url(#cloudGrad)" opacity="0.95"/>
      </g>

      <!-- Right: Telemetry Metrics Cards -->
      <g transform="translate(320, 0)">
        <!-- Metric 1: Humidity -->
        <g transform="translate(0, 0)">
          <rect width="180" height="64" rx="8" fill="#14213d" stroke="#1e293b" stroke-width="1"/>
          <!-- Droplet Icon -->
          <circle cx="26" cy="32" r="14" fill="#0284c7" fill-opacity="0.2"/>
          <path d="M26 23 C26 23 20 31 20 35 C20 38.3 22.7 41 26 41 C29.3 41 32 38.3 32 35 C32 31 26 23 26 23 Z" fill="#38bdf8"/>
          <text x="48" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Humidity</text>
          <text x="48" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">58%</text>
        </g>

        <!-- Metric 2: Wind Speed -->
        <g transform="translate(0, 74)">
          <rect width="180" height="64" rx="8" fill="#14213d" stroke="#1e293b" stroke-width="1"/>
          <!-- Wind Icon -->
          <circle cx="26" cy="32" r="14" fill="#3b82f6" fill-opacity="0.2"/>
          <path d="M19 30 H29 C31 30 32 29 32 27 C32 25 30 24 28 24 C26 24 25 25 25 26 M17 34 H32 C34 34 35 35 35 37 C35 39 33 40 31 40" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
          <text x="48" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Wind Speed</text>
          <text x="48" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">14 km/h</text>
        </g>

        <!-- Metric 3: Air Pressure / Telemetry -->
        <g transform="translate(0, 148)">
          <rect width="180" height="64" rx="8" fill="#14213d" stroke="#1e293b" stroke-width="1"/>
          <!-- Gauge Icon -->
          <circle cx="26" cy="32" r="14" fill="#10b981" fill-opacity="0.2"/>
          <path d="M19 35 A9 9 0 1 1 33 35" fill="none" stroke="#34d399" stroke-width="1.8"/>
          <line x1="26" y1="32" x2="30" y2="28" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
          <text x="48" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8">Telemetry Pressure</text>
          <text x="48" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">1018 hPa</text>
        </g>
      </g>
    </g>
  </g>
</svg>
