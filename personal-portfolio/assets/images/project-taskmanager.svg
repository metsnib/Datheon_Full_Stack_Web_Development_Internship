<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="cardGradTM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#tmBg)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,3">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
  </g>

  <!-- Application Window -->
  <g transform="translate(30, 24)" filter="url(#cardShadow)">
    <!-- App Container -->
    <rect width="540" height="312" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- App Top Bar -->
    <rect width="540" height="48" rx="14" fill="#172033"/>
    <rect y="36" width="540" height="12" fill="#172033"/>
    <line x1="0" y1="48" x2="540" y2="48" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="24" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>

    <!-- Header Title & Icon -->
    <path d="M96 24 L100 28 L108 20" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <text x="116" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Dynamic Task Manager</text>

    <!-- New Task Button -->
    <rect x="420" y="14" width="100" height="26" rx="6" fill="url(#btnGrad)"/>
    <text x="470" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add Task</text>

    <!-- App Body: 3 Columns (To Do, In Progress, Completed) -->
    <!-- Column 1: To Do -->
    <g transform="translate(18, 64)">
      <rect width="160" height="232" rx="8" fill="#141c2e" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#94a3b8"/>
      <text x="26" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">To Do (2)</text>

      <!-- Task Card 1 -->
      <g transform="translate(10, 36)">
        <rect width="140" height="78" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="46" height="16" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="33" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#60a5fa" text-anchor="middle">FEATURE</text>
        <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">Implement Auth</text>
        <text x="10" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">JWT login workflow</text>
        <circle cx="120" cy="62" r="8" fill="#3b82f6" fill-opacity="0.3"/>
        <text x="120" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#93c5fd" text-anchor="middle">MB</text>
      </g>

      <!-- Task Card 2 -->
      <g transform="translate(10, 124)">
        <rect width="140" height="78" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="38" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="29" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">DOCS</text>
        <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">API Reference</text>
        <text x="10" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">CRUD endpoints docs</text>
        <circle cx="120" cy="62" r="8" fill="#f59e0b" fill-opacity="0.3"/>
        <text x="120" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#fde68a" text-anchor="middle">MB</text>
      </g>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(190, 64)">
      <rect width="160" height="232" rx="8" fill="#141c2e" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
      <text x="26" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">In Progress (1)</text>

      <!-- Task Card Active -->
      <g transform="translate(10, 36)">
        <rect width="140" height="92" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="10" y="10" width="52" height="16" rx="4" fill="#0284c7" fill-opacity="0.25"/>
        <text x="36" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">FRONTEND</text>
        <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f1f5f9">State Sync &amp; CRUD</text>
        <text x="10" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Interactive actions</text>
        
        <!-- Progress bar -->
        <rect x="10" y="68" width="120" height="4" rx="2" fill="#334155"/>
        <rect x="10" y="68" width="90" height="4" rx="2" fill="#38bdf8"/>
        
        <circle cx="120" cy="82" r="8" fill="#0284c7" fill-opacity="0.4"/>
        <text x="120" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7dd3fc" text-anchor="middle">MB</text>
      </g>
    </g>

    <!-- Column 3: Completed -->
    <g transform="translate(362, 64)">
      <rect width="160" height="232" rx="8" fill="#141c2e" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="26" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Completed (3)</text>

      <!-- Completed Task Card -->
      <g transform="translate(10, 36)">
        <rect width="140" height="78" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" stroke-opacity="0.6"/>
        <rect x="10" y="10" width="46" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="33" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">DEPLOY</text>
        <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-decoration="line-through">Vercel Setup</text>
        <text x="10" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Live build passing</text>
        <circle cx="120" cy="62" r="8" fill="#10b981" fill-opacity="0.3"/>
        <text x="120" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#6ee7b7" text-anchor="middle">✓</text>
      </g>

      <g transform="translate(10, 124)">
        <rect width="140" height="78" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <rect x="10" y="10" width="46" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="33" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">DESIGN</text>
        <text x="10" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-decoration="line-through">Dark Navy Theme</text>
        <text x="10" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Responsive layout</text>
        <circle cx="120" cy="62" r="8" fill="#10b981" fill-opacity="0.3"/>
        <text x="120" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#6ee7b7" text-anchor="middle">✓</text>
      </g>
    </g>
  </g>
</svg>
